services:
  - type: web
    name: soccerhub-ai-service
    env: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://soccer-hub-wheat.vercel.app,http://localhost:3000,http://localhost:3001"

  - type: web
    name: soccerhub-backend-core
    env: java
    rootDir: backend-core
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/backend-core-1.0.0.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://soccer-hub-wheat.vercel.app,http://localhost:3000,http://localhost:3001"
