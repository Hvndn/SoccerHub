version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: soccerhub-mysql
    environment:
      MYSQL_DATABASE: soccerhub_db
      MYSQL_USER: soccerhub_user
      MYSQL_PASSWORD: soccerhub_password
      MYSQL_ROOT_PASSWORD: soccerhub_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soccerhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: soccerhub-ai-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://soccerhub_user:soccerhub_password@mysql:3306/soccerhub_db
    depends_on:
      mysql:
        condition: service_healthy

  backend-core:
    build:
      context: ./backend-core
    container_name: soccerhub-backend-core
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/soccerhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=soccerhub_user
      - SPRING_DATASOURCE_PASSWORD=soccerhub_password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: soccerhub-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
      - NEXT_PUBLIC_AI_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend-core

volumes:
  mysql_data:
  redis_data:

