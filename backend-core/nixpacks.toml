# Railway Nixpacks build cho backend-core (không dùng Docker).
# Đặt Root Directory của service = backend-core.
[variables]
NIXPACKS_JDK_VERSION = "17"

[phases.build]
cmds = ["mvn clean package -DskipTests"]

[start]
cmd = "java -Xmx256m -Xms128m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -jar target/backend-core-1.0.0.jar"
