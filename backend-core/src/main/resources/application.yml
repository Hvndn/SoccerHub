server:
  # Railway cấp cổng động qua biến PORT; local mặc định 8080
  port: ${PORT:8080}

spring:
  application:
    name: Turfzone-backend-core
  datasource:
    # Ưu tiên SPRING_DATASOURCE_URL gán tay; nếu không, tự ráp từ biến
    # MYSQL* mà Railway MySQL plugin cấp (local fallback về localhost).
    # LƯU Ý: không dùng createDatabaseIfNotExist — user MySQL trên Railway /
    # PlanetScale / Aiven thường KHÔNG có quyền CREATE DATABASE nên sẽ lỗi
    # ngay lúc Hibernate chạy ddl-auto: update. Database luôn được plugin tạo sẵn.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:${MYSQLDATABASE:soccerhub_db}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:1234}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      # Timeout nhanh 5s để nếu MySQL ngủ/tắt thì DataSourceStartupRetry lập tức chuyển sang H2 dự phòng
      connection-timeout: 5000
      initialization-fail-timeout: -1
      maximum-pool-size: 5
      minimum-idle: 1
      # Gửi ping TCP giữ kết nối liên tục cứ mỗi 3 phút (180000ms), ngăn Railway MySQL đi vào trạng thái Sleeping
      keepalive-time: 180000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    # Chỉ bật khi debug local; Railway/Render production để false để log không bị ngập
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
  # Không dùng Redis — chỉ khởi động MySQL

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  # BẮT BUỘC đặt biến môi trường JWT_SECRET (>= 32 ký tự) khi chạy production.
  # Secret nằm cứng trong repo = ai đọc mã nguồn cũng tự ký được token ADMIN.
  # Để trống thì ứng dụng dùng secret dự phòng cho local và in cảnh báo rõ ràng.
  secret: ${JWT_SECRET:}
  expiration: 86400000

# ============================================================================
#  ĐĂNG NHẬP GOOGLE (Sign in with Google)
# ============================================================================
#  Mặc định để trống -> tính năng đăng nhập Google bị tắt.
#  Để bật:
#   1. Vào https://console.cloud.google.com/apis/credentials
#   2. Tạo OAuth 2.0 Client ID (loại Web application)
#   3. Authorized JavaScript origins: http://localhost:3000 (và domain production)
#   4. Authorized redirect URIs: http://localhost:3000
#   5. Copy Client ID vào GOOGLE_CLIENT_ID (backend) và NEXT_PUBLIC_GOOGLE_CLIENT_ID (frontend)
# ============================================================================
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# ============================================================================
#  GỬI EMAIL (SMTP)
# ============================================================================
#  Mặc định TẮT — hệ thống vẫn chạy bình thường, chỉ ghi cảnh báo vào log.
#  Muốn bật: đặt MAIL_ENABLED=true + điền thông tin SMTP.
#
#  Gmail: bật Xác thực 2 lớp -> tạo "Mật khẩu ứng dụng" (16 ký tự)
#         -> MAIL_USERNAME = gmail của bạn, MAIL_PASSWORD = mật khẩu ứng dụng
#         (không dùng mật khẩu đăng nhập Gmail thường)
#
#  SendGrid/Resend: đổi host + user + app key tương ứng.
# ============================================================================
mail:
  enabled: ${MAIL_ENABLED:false}
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@Turfzone.vn}}
  from-name: ${MAIL_FROM_NAME:Turfzone}

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
        connectiontimeout: 15000
        timeout: 15000
        writetimeout: 15000
