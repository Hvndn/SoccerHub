server:
  port: 8080

spring:
  application:
    name: soccerhub-backend-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/soccerhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:soccerhub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:soccerhub_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  secret: SoccerHubSuperSecretKeyForJWTAuthentication2026PitchManagement
  expiration: 86400000
