server:
  # Railway cấp cổng động qua biến PORT; local mặc định 8080
  port: ${PORT:8080}

spring:
  application:
    name: soccerhub-backend-core
  datasource:
    # Ưu tiên SPRING_DATASOURCE_URL gán tay; nếu không, tự ráp từ biến
    # MYSQL* mà Railway MySQL plugin cấp (local fallback về localhost)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:soccerhub_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:1234}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    # Chỉ bật khi debug local; Railway/Render production để false để log không bị ngập
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  secret: SoccerHubSuperSecretKeyForJWTAuthentication2026PitchManagement
  expiration: 86400000
